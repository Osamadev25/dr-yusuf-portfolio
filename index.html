<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const savedLanguage = localStorage.getItem("dr-yusuf-language");
          const browserLanguages = navigator.languages?.length
            ? navigator.languages
            : [navigator.language];
          const browserLanguage = browserLanguages.some((value) =>
            value?.toLowerCase().startsWith("ar"),
          )
            ? "ar"
            : "en";
          const language =
            savedLanguage === "ar" || savedLanguage === "en"
              ? savedLanguage
              : browserLanguage;
          document.documentElement.lang = language;
          document.documentElement.dir = language === "ar" ? "rtl" : "ltr";

          const savedTheme = localStorage.getItem("dr-yusuf-theme");
          const theme =
            savedTheme === "dark" || savedTheme === "light"
              ? savedTheme
              : window.matchMedia?.("(prefers-color-scheme: dark)")?.matches
                ? "dark"
                : "light";
          document.documentElement.classList.toggle("dark", theme === "dark");
        } catch {
          /* Continue with the static document defaults. */
        }
      })();
    </script>
